name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, demo-akp]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install project SDK and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test core and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftWorldTranslator-debug
          path: app/build/outputs/apk/debug/*.apk


  cleanup:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove older completed Build APK runs on this branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          current_id = int(os.environ["CURRENT_RUN_ID"])
          current_number = int(os.environ["CURRENT_RUN_NUMBER"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          root = f"https://api.github.com/repos/{repo}"
          old_runs = []
          page = 1
          while True:
              query = urlencode({"branch": branch, "per_page": 100, "page": page})
              request = Request(f"{root}/actions/workflows/build-apk.yml/runs?{query}", headers=headers)
              with urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]
              old_runs.extend(
                  run["id"] for run in runs
                  if run["id"] != current_id
                  and run["run_number"] < current_number
                  and run["status"] == "completed"
                  and run["head_branch"] == branch
              )
              if len(runs) < 100:
                  break
              page += 1

          for run_id in old_runs:
              request = Request(f"{root}/actions/runs/{run_id}", headers=headers, method="DELETE")
              with urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f"Could not delete workflow run {run_id}: {response.status}")
              print(f"Deleted old Build APK run {run_id}")
          print(f"Kept current run {current_id}; removed {len(old_runs)} older completed runs on {branch}")
          PY
